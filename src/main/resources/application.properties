spring.application.name=api-gateway

# Configuración de Eureka - tener nuestra lista de microservicios
#script.cloud.gateway.discovery.locator.enabled=true

# Configuración de Eureka - tener nuestra lista de microservicios
#eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# Configurar loadbalancer
spring.cloud.loadbalancer.ribbon.enabled=false

# Configuración ruteo dinámica de los microservicios
    spring.cloud.gateway.routes[0].id=product-microservice
    spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICE
    #ruta se activa para varios endpoints de forma correcta, usa una sola entrada Path con múltiples patrones separados por coma
    spring.cloud.gateway.routes[0].predicates[0]=Path=/sistema/api/v1/products/**, /sistema/api/v2/products/**, \
                                             /sistema/api/v1/categories/**, /sistema/api/v1/test/**

    spring.cloud.gateway.routes[1].id=booking-microservice
    spring.cloud.gateway.routes[1].uri=lb://BOOKING-MICROSERVICE
    #ruta se activa para varios endpoints de forma correcta, usa una sola entrada Path con múltiples patrones separados por coma
    spring.cloud.gateway.routes[1].predicates[0]=Path=/v1/categories/**, /api/v1/bookings/**

    spring.cloud.gateway.routes[2].id=booking-microservice-groovy
    spring.cloud.gateway.routes[2].uri=lb://BOOKING-MICROSERVICE-GROOVY
    #ruta se activa para varios endpoints de forma correcta, usa una sola entrada Path con múltiples patrones separados por coma
    spring.cloud.gateway.routes[2].predicates[0]=Path=/category/**

    spring.cloud.gateway.routes[3].id=HL7-FHIR-PATIENT-ORACLE
    spring.cloud.gateway.routes[3].uri=lb://HL7-FHIR-PATIENT-ORACLE
    #ruta se activa para varios endpoints de forma correcta, usa una sola entrada Path con múltiples patrones separados por coma
    spring.cloud.gateway.routes[3].predicates[0]=Path=/v1/patients/**, /v1/refreshscope/**


# Configuraciones de seguridad
# Parámetros desde http://localhost:9090/realms/mycompany-microservice-realm/.well-known/openid-configuration
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9090/realms/mycompany-microservice-realm
# cloud Id
spring.security.oauth2.client.registration.spring-cloud-gateway-client.client-id=spring-cloud-gateway-client
spring.security.oauth2.client.registration.spring-cloud-gateway-client.client-secret=5YE56OtU3iPHRHX7iPfzjzTtJE6UPNVD
spring.security.oauth2.client.registration.spring-cloud-gateway-client.provider=keycloak
#spring.security.oauth2.client.registration.spring-cloud-gateway-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spring-cloud-gateway-client.authorization-grant-type=authorization_code
# ? La URL correcta para redirigir después de autenticarse en Keycloak
#spring.security.oauth2.client.registration.spring-cloud-gateway-client.redirect-uri=http://localhost:8080/login/oauth2/code/spring-cloud-gateway-client
#spring.security.oauth2.client.registration.spring-cloud-gateway-client.redirect-uri=http://localhost:8080/login/oauth2/code/spring-cloud-gateway-client
spring.security.oauth2.client.registration.spring-cloud-gateway-client.redirect-uri=http://localhost:8080/login/oauth2/code/spring-cloud-gateway-client
security.enable-csrf=false
spring.cloud.gateway.default-filters=TokenRelay


#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/mycompany-microservice-realm/protocol/openid-connect/certs
spring.security.oauth2.client.registration.spring-cloud-gateway-client.scope=openid,profile,email
logging.level.org.springframework.security=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/mycompany-microservice-realm
